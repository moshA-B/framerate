# nginx.conf - how the website container serves our files.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;

        # "no-cache" does NOT mean "never store". It means: before using a stored copy, ask the
        # server "is this still the latest?" (a tiny request; the answer is usually "yes, unchanged").
        # Without this line, browsers may keep an OLD admin.js or style.css for days and show a new
        # page with old scripts - buttons that do nothing and charts that stay empty.
        add_header Cache-Control "no-cache";
    }
}
