# nginx.conf - how the website container serves our built React app (the files in dist/).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Router draws pages in the browser, so /wishlist or /details/movie/603 are NOT
        # real files. If no file matches, we send index.html and React shows the right page.
        # (Without this line, refreshing the browser on /wishlist would give a 404.)
        try_files $uri /index.html;

        # "no-cache" does NOT mean "never store". It means: before using a stored copy, ask the
        # server "is this still the latest?" (a tiny request; the answer is usually "yes, unchanged").
        # Without it a browser may keep an OLD index.html and miss a new version of the site.
        # (The JS and CSS files get a new name on every build, so they are never stale.)
        add_header Cache-Control "no-cache";
    }
}
