<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refine my taste - Framerate</title>
  <!-- The two fonts of the design. If they cannot load, the browser uses a normal font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The navbar and footer are filled in by auth.js, so every page shares them. -->
  <header id="navbar" class="navbar"></header>

  <main class="page">
    <h1 class="page-title">Refine my taste</h1>
    <p class="muted" style="max-width:62ch">Tell us what you think of some well-known titles. The more you answer, the better your
      "For you" picks and The Reel get. Haven't seen it? Just skip.</p>
    <p id="error" class="msg msg-error" role="alert" hidden></p>

    <div class="taste-layout">
      <section>
        <div id="type-toggle" class="toggle section" role="group" aria-label="Movies or series">
          <button type="button" data-type="movie" aria-pressed="true">Movies</button>
          <button type="button" data-type="tv" aria-pressed="false">Series</button>
        </div>
        <div id="stage" class="stage"></div>
        <p class="muted" style="text-align:center">Keyboard: left arrow = not for me, right arrow = like it, down arrow = skip.</p>
      </section>

      <aside class="panel" aria-label="Your taste so far">
        <h2>Your taste so far</h2>
        <p id="count" class="muted"></p>
        <div id="profile"></div>
        <hr>
        <div class="row">
          <a class="btn btn-primary" href="index.html#for-you">See my picks</a>
          <button id="reset" class="btn btn-small" type="button">Reset my taste</button>
        </div>
      </aside>
    </div>
  </main>

  <footer id="footer" class="footer"></footer>

  <!-- Order matters: later scripts use functions from earlier ones. -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/taste.js"></script>
</body>
</html>
