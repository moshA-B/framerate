<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Framerate</title>
  <!-- The two fonts of the design. If they cannot load, the browser uses a normal font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The navbar and footer are filled in by auth.js, so every page shares them. -->
  <header id="navbar" class="navbar"></header>

  <main class="page">
    <h1 class="page-title">Admin</h1>
    <p id="error" class="msg msg-error" role="alert" hidden></p>

    <section class="section">
      <h2 class="section-title">Numbers</h2>
      <div id="stats" class="stats"></div>
    </section>

    <section class="section">
      <h2 class="section-title sky">Trends</h2>
      <div class="chart-grid">
        <figure class="chart"><figcaption>New users, last 14 days</figcaption><div id="chart-signups"></div></figure>
        <figure class="chart"><figcaption>How people rate (1 to 10)</figcaption><div id="chart-ratings"></div></figure>
        <figure class="chart"><figcaption>Popular genres</figcaption><div id="chart-genres"></div></figure>
        <figure class="chart"><figcaption>Most active users</figcaption><div id="chart-users"></div></figure>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Most watched</h2>
      <div id="top" class="grid"></div>
      <div id="top-empty"></div>
    </section>

    <section class="section">
      <h2 class="section-title sky">Most wishlisted</h2>
      <div id="wished" class="grid"></div>
      <div id="wished-empty"></div>
    </section>

    <section class="section">
      <h2 class="section-title cobalt">Best rated by the community</h2>
      <p class="muted">Average of all users' ratings. A title needs at least 2 ratings.</p>
      <div id="best" class="grid"></div>
      <div id="best-empty"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Review moderation</h2>
      <form id="review-search" class="row" role="search">
        <input id="review-q" class="search-input" type="search" maxlength="100" aria-label="Search reviews"
               placeholder="Search words in reviews" style="flex:1; min-width:220px">
        <button class="btn" type="submit">Search</button>
      </form>
      <p id="review-count" class="muted" aria-live="polite"></p>
      <div id="reviews" class="reviews"></div>
      <button id="reviews-more" class="btn" type="button" hidden>Load more</button>
    </section>

    <section class="section">
      <h2 class="section-title cobalt">Users</h2>
      <div class="table-wrap"><table id="users"></table></div>
    </section>
  </main>

  <footer id="footer" class="footer"></footer>

  <!-- Order matters: later scripts use functions from earlier ones. -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
