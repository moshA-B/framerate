<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Framerate</title>
  <!-- The two fonts of the design. If they cannot load, the browser uses a normal font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The navbar and footer are filled in by auth.js, so every page shares them. -->
  <header id="navbar" class="navbar"></header>

  <main class="page">
    <h1 class="page-title">Admin</h1>
    <p id="error" class="msg msg-error" role="alert" hidden></p>

    <section class="section">
      <h2 class="section-title">Numbers</h2>
      <div id="stats" class="stats"></div>
    </section>

    <section class="section">
      <h2 class="section-title sky">Most watched</h2>
      <div id="top" class="grid"></div>
      <div id="top-empty"></div>
    </section>

    <section class="section">
      <h2 class="section-title cobalt">Users</h2>
      <div class="table-wrap"><table id="users"></table></div>
    </section>
  </main>

  <footer id="footer" class="footer"></footer>

  <!-- Order matters: later scripts use functions from earlier ones. -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
