<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password - Framerate</title>
  <!-- The two fonts of the design. If they cannot load, the browser uses a normal font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The navbar and footer are filled in by auth.js, so every page shares them. -->
  <header id="navbar" class="navbar"></header>

  <main class="page">
    <div class="form-card">
      <h1>New password</h1>
      <p id="error" class="msg msg-error" role="alert" hidden></p>
      <p id="done" class="msg msg-info" role="status" hidden></p>
      <form id="form">
        <div class="field">
          <label for="password">New password (at least 6 characters)</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
        </div>
        <button class="btn btn-primary" type="submit" id="submit">Change password</button>
      </form>
      <div class="form-links">
        <a href="login.html">Back to login</a>
      </div>
    </div>
  </main>

  <footer id="footer" class="footer"></footer>

  <!-- Order matters: later scripts use functions from earlier ones. -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
